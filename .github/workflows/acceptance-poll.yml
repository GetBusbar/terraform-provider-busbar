name: acceptance-poll

# ---------------------------------------------------------------------------
# Why this workflow looks nothing like homebrew-busbar's bump-formula or
# helm-charts' bump-chart.yml, even though it's the same "daily poll, self-
# heal" pattern:
#
# Homebrew and Helm both track busbar in lockstep by design (a formula/chart
# IS busbar, repackaged) so "bump a pinned version field to match busbar's
# latest release" is always correct and safe to do unattended.
#
# terraform-provider-busbar is different: it's a client of a RUNNING busbar
# instance's admin API, with its OWN independent semver. Whether a new busbar
# release requires a new provider release depends on whether that release
# changed the admin API surface the provider's Go code depends on -- not on
# busbar's version number. Auto-bumping and auto-tagging a provider release
# the moment busbar cuts a new version would be actively dangerous here: a
# broken/incompatible provider release that Terraform users pull down can
# corrupt live Terraform state, which is a much worse failure mode than a
# stale Homebrew formula or Helm chart (those just fail to update until the
# next successful poll). This repo has already lived that exact risk once:
# virtual_key_resource.go and hook_resource.go used to send 1.4.x-only admin
# API fields that 1.5.0's stricter (deny_unknown_fields) schema rejects
# (both were migrated to the 1.5.0 contract).
#
# So instead of "bump and tag", this workflow does the conservative thing:
# check whether busbar has a release newer than the one the acceptance suite
# was last verified against (tracked in .github/ACCEPTANCE_BUSBAR_VERSION,
# not a released provider version), and if so, actually build that busbar
# release from source and run the real Create->Read->Update->Delete->Import
# acceptance suite against it end to end.
#
#   - Tests PASS  -> record the candidate in .github/ACCEPTANCE_BUSBAR_VERSION
#                    on the dedicated `acceptance-marker` branch (this org
#                    blocks Actions from creating PRs and main requires PR
#                    review, so the marker lives on its own unprotected
#                    branch; the copy on main is only the seed the check job
#                    falls back to when the marker branch does not exist yet).
#                    The file is a pure "last version the suite was proven
#                    against" marker — recording it publishes nothing and tags
#                    nothing; whether a provider release is warranted stays a
#                    human decision.
#   - Tests FAIL  -> maintain THE ONE open `acceptance-broken` issue (edit it and
#                    comment if it exists, open it only if it does not) with the
#                    failure output, so the incompatibility is visible without
#                    blocking anything or publishing anything broken.
#                    ACCEPTANCE_BUSBAR_VERSION is left untouched. A later PASS
#                    closes that issue, so the tracker never carries a stale
#                    "we are broken" claim. See the two jobs at the bottom.
#
# Daily (self-healing -- a missed run just catches up next time), on-demand,
# and instantly on an upstream release via repository_dispatch.
# ---------------------------------------------------------------------------
on:
  schedule:
    - cron: "9 7 * * *"
  workflow_dispatch: {}
  repository_dispatch:
    types: [upstream-release]   # optional instant trigger from a core release (needs a PAT)

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      candidate: ${{ steps.compare.outputs.candidate }}
      run: ${{ steps.compare.outputs.run }}
    steps:
      - uses: actions/checkout@v4
      - id: compare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest="$(gh release view --repo GetBusbar/busbar --json tagName -q .tagName)"
          # The live marker is kept on the acceptance-marker branch (record-pass
          # cannot push to the PR-review-protected main); the copy on main is
          # only the initial seed.
          pinned="$(gh api "repos/${GITHUB_REPOSITORY}/contents/.github/ACCEPTANCE_BUSBAR_VERSION?ref=acceptance-marker" -q .content 2>/dev/null | base64 -d || cat .github/ACCEPTANCE_BUSBAR_VERSION)"
          echo "latest busbar release: $latest"
          echo "last verified against: $pinned"
          if [ "$latest" = "$pinned" ]; then
            echo "already verified against $latest, nothing to do"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "candidate=$latest" >> "$GITHUB_OUTPUT"
          fi

  acceptance:
    needs: check
    if: needs.check.outputs.run == 'true'
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.gate.outputs.result }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.*"
          terraform_wrapper: false

      - name: checkout busbar at candidate release
        uses: actions/checkout@v4
        with:
          repository: GetBusbar/busbar
          ref: ${{ needs.check.outputs.candidate }}
          path: busbar-src

      - uses: dtolnay/rust-toolchain@stable

      - name: build busbar
        id: build
        working-directory: busbar-src
        run: cargo build --release -p busbar

      - name: boot busbar gateway
        id: boot
        if: steps.build.outcome == 'success'
        run: |
          mkdir -p "$RUNNER_TEMP/busbar"
          # busbar 1.5.0 config syntax. groups.tfacc-group must exist: 1.5.0 keys
          # are pure auth bound to a `groups:` bucket, and the virtual-key
          # acceptance test mints a key bound to tfacc-group.
          cat > "$RUNNER_TEMP/busbar/config.yaml" <<'YAML'
          listen: "127.0.0.1:8080"
          admin_listen: "127.0.0.1:8081"
          auth:
            chain: [keys]
            admin_auth:
              - admin-tokens: { token: { env: "BUSBAR_ADMIN_TOKEN" } }
          providers:
            anthropic:
              api_key: { env: "ANTHROPIC_API_KEY" }
          models:
            test-model:
              provider: anthropic
          groups:
            tfacc-group: {}
          YAML
          ANTHROPIC_API_KEY="dummy" BUSBAR_ADMIN_TOKEN="tfacc-admin-token" \
            BUSBAR_CONFIG="$RUNNER_TEMP/busbar/config.yaml" \
            BUSBAR_PROVIDERS="$GITHUB_WORKSPACE/busbar-src/providers.yaml" \
            ./busbar-src/target/release/busbar > "$RUNNER_TEMP/busbar/busbar.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/busbar/pid"
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8081/api/v1/admin/info \
              -H "x-admin-token: tfacc-admin-token" >/dev/null; then
              echo "gateway up"; exit 0
            fi
            sleep 2
          done
          echo "gateway did not become ready against candidate release"
          cat "$RUNNER_TEMP/busbar/busbar.log"
          exit 1

      - name: acceptance tests
        id: test
        if: steps.boot.outcome == 'success'
        env:
          TF_ACC: "1"
          BUSBAR_ENDPOINT: http://localhost:8081
          BUSBAR_ADMIN_TOKEN: tfacc-admin-token
        # pipefail is required: without it the step's exit code is tee's (always
        # 0), which once masked a 3/4-failing suite as a green run.
        run: |
          set -o pipefail
          go test ./internal/provider/ -run TestAcc -v -timeout 30m 2>&1 | tee "$RUNNER_TEMP/acceptance.log"

      - name: gate on overall result
        id: gate
        if: always()
        run: |
          if [ "${{ steps.build.outcome }}" = "success" ] && \
             [ "${{ steps.boot.outcome }}" = "success" ] && \
             [ "${{ steps.test.outcome }}" = "success" ]; then
            echo "result=pass" >> "$GITHUB_OUTPUT"
          else
            echo "result=fail" >> "$GITHUB_OUTPUT"
          fi

      - name: upload failure log
        if: steps.gate.outputs.result == 'fail'
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-failure-${{ needs.check.outputs.candidate }}
          path: |
            /tmp/**/busbar.log
            /tmp/**/acceptance.log
          if-no-files-found: ignore
          retention-days: 14

  record-pass:
    needs: [check, acceptance]
    if: needs.check.outputs.run == 'true' && needs.acceptance.outputs.result == 'pass'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - env:
          CANDIDATE: ${{ needs.check.outputs.candidate }}
        # ACCEPTANCE_BUSBAR_VERSION is the "last busbar release this suite was
        # proven against" marker. A green run records the candidate on the
        # dedicated acceptance-marker branch (main requires PR review and this
        # org blocks Actions-created PRs, so main itself is not writable from
        # here; the check job reads the marker branch first). Recording
        # publishes/tags nothing — a provider release stays a human call.
        run: |
          set -euo pipefail
          git config user.name "busbar-bot"
          git config user.email "bot@getbusbar.com"
          echo "$CANDIDATE" > .github/ACCEPTANCE_BUSBAR_VERSION
          git add .github/ACCEPTANCE_BUSBAR_VERSION
          git commit -m "Record acceptance suite passing against busbar ${CANDIDATE}

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          git push origin HEAD:refs/heads/acceptance-marker --force

  # always() is load-bearing: when the acceptance JOB fails outright (build/
  # boot/test step failure), the default success() gate would SKIP this job and
  # the failure would never surface as an issue. always() + (job failed OR the
  # gate step said fail) makes the failure path actually reachable.
  #
  # -- ONE ISSUE, REUSED. THIS USED TO FILE A NEW ONE EVERY RUN ---------------
  # This job called `gh issue create` unconditionally, on a DAILY cron, on a
  # PUBLIC repo. It had filed FOURTEEN issues (#2..#8, #10..#16) saying the same
  # thing across three busbar releases: three for v1.5.1, five for v1.5.2, six
  # for v1.5.3 and counting. Every one of them is a true report -- the suite
  # really is failing -- so the defect is not the reporting, it is that the
  # reporting has no memory. A tracker where one open incident is represented by
  # N issues is a tracker nobody can read: the newest report of a week-old
  # problem looks like a new problem, and the fourteen together look like
  # fourteen.
  #
  # The pattern below is ported verbatim in shape from GetBusbar/busbar's
  # .github/workflows/verify-deploy.yml `alert` job: search for an open issue by
  # LABEL, edit + comment on it if one exists, create one only if none does.
  #
  # THE LABEL IS THE IDENTITY, AND IT IS DELIBERATELY NOT `bug`. The search key
  # has to be something ONLY this workflow ever applies. The old code labelled
  # these `bug`, which is also what a human files, so reusing on `bug` would let
  # this job silently overwrite the title and body of a hand-written issue. A
  # dedicated `acceptance-broken` label is owned by this job and by nothing else.
  # `bug` is still applied on create, for triage, but is never searched on.
  #
  # WHY NOT KEY ON THE CANDIDATE VERSION. Filing one issue per busbar release
  # would still be four issues for what is, in this case, one unresolved
  # incompatibility that has simply outlived three releases. The incident is "the
  # acceptance suite does not pass against current busbar", and the version it
  # last failed against is a PROPERTY of that incident, so it lives in the title
  # and body, which are rewritten on every run.
  open-issue-on-fail:
    needs: [check, acceptance]
    if: always() && needs.check.outputs.run == 'true' && (needs.acceptance.result == 'failure' || needs.acceptance.outputs.result == 'fail')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      CANDIDATE: ${{ needs.check.outputs.candidate }}
      REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      LABEL: acceptance-broken
    steps:
      - name: Open or update the single open acceptance-broken issue
        run: |
          # `set +e` FIRST. GitHub runs every `run:` block as `bash -e {0}`, so
          # errexit is already on before line 1 and `set -uo pipefail` does not
          # turn it off. Without this, a non-fatal `gh` hiccup (a label that
          # already exists, a transient API 502) would abort the step BEFORE the
          # ::error:: annotation below is emitted, and the run would go red with
          # no statement of what broke.
          set +e
          set -uo pipefail

          TITLE="[acceptance-broken] Acceptance tests fail against busbar ${CANDIDATE}"
          # A stable marker so the body is unambiguously machine-written and
          # therefore safe for this job to overwrite wholesale.
          MARKER="<!-- acceptance-poll-alert -->"
          body_file="$(mktemp)"
          {
            echo "$MARKER"
            echo
            echo "The daily acceptance-poll workflow tried to build busbar \`${CANDIDATE}\` from source, boot it, and run this provider's TestAcc suite against it. It did not pass (build, boot, or the acceptance tests themselves failed)."
            echo
            echo "This is exactly the kind of incompatibility this workflow exists to catch before a broken provider release ships — most likely \`${CANDIDATE}\` changed part of the admin API surface (request/response shapes, config syntax, or boot behavior) that this provider depends on."
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| busbar release under test | \`${CANDIDATE}\` |"
            echo "| failing run | ${RUN_URL} |"
            echo "| triggered by | \`${GITHUB_EVENT_NAME}\` |"
            echo "| last checked | $(date -u '+%Y-%m-%d %H:%M UTC') |"
            echo
            echo ".github/ACCEPTANCE_BUSBAR_VERSION was left unchanged, so the suite will keep re-checking on every daily run until this is resolved."
            echo
            echo "Logs are in the \`acceptance-failure-${CANDIDATE}\` artifact on the run above (14-day retention)."
            echo
            echo "---"
            echo
            echo "**This issue is reused, not duplicated.** Every later failure retitles it, rewrites"
            echo "this body and adds a comment, so one open incident stays one issue however many"
            echo "busbar releases it outlives. It closes itself when the suite passes."
          } > "$body_file"

          # The label is what makes reuse work, so create it rather than assume
          # it exists. Failure here is non-fatal: the overwhelmingly common cause
          # is that it already exists.
          gh label create "$LABEL" --repo "$REPO" \
            --color B60205 \
            --description "The TestAcc suite does not pass against current busbar (auto-filed)" \
            >/dev/null 2>&1 || true

          existing="$(gh issue list --repo "$REPO" --label "$LABEL" --state open \
            --limit 1 --json number --jq '.[0].number // empty' 2>/dev/null || true)"

          if [ -n "${existing:-}" ]; then
            echo "Reusing open issue #${existing} (idempotent: the daily cron must never file a second one)."
            gh issue edit "$existing" --repo "$REPO" --title "$TITLE" --body-file "$body_file"
            gh issue comment "$existing" --repo "$REPO" \
              --body "Still failing as of $(date -u '+%Y-%m-%d %H:%M UTC'), now against busbar \`${CANDIDATE}\` — ${RUN_URL}"
            ISSUE_URL="${GITHUB_SERVER_URL}/${REPO}/issues/${existing}"
          else
            ISSUE_URL="$(gh issue create --repo "$REPO" --title "$TITLE" \
              --label "$LABEL" --label bug --body-file "$body_file" 2>/dev/null | tail -1)"
            echo "Opened ${ISSUE_URL}"
          fi

          # THE CI SIGNAL IS NOT THE ISSUE. The `acceptance` job is already red,
          # which is what turns the run red; this annotation is what makes the
          # cause readable from the run summary without opening the issue. Both
          # are kept deliberately -- the issue comes and finds a human, the red
          # run and the annotation are the signal for whoever is already looking.
          echo "::error::Acceptance tests FAIL against busbar ${CANDIDATE}. Tracking issue: ${ISSUE_URL}"

  # THE OTHER HALF OF IDEMPOTENCY, AND THE REASON THE PATTERN IS WORTH COPYING
  # RATHER THAN JUST DE-DUPLICATING THE CREATE. Without this, the issue is opened
  # once and lives forever: a stale open "acceptance is broken" issue is worse
  # than none, because the next real breakage looks like the old one and gets
  # ignored. A run in which the suite actually passes closes it and says why.
  #
  # GATED ON A REAL PASS, NOT ON `run == false`. When `check` reports run=false
  # the suite did NOT execute this cycle -- the marker simply already names the
  # current busbar release. That is the absence of evidence, not evidence of a
  # fix, and closing on it would let a cron in which nothing ran wipe out a
  # finding that a cron which did run had recorded. Only `result == 'pass'`,
  # which means this run really did build busbar, boot it and drive the full
  # Create->Read->Update->Delete->Import suite against it, closes the issue.
  close-issue-on-pass:
    needs: [check, acceptance]
    if: always() && needs.check.outputs.run == 'true' && needs.acceptance.outputs.result == 'pass'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      CANDIDATE: ${{ needs.check.outputs.candidate }}
      REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      LABEL: acceptance-broken
    steps:
      - name: Close any open acceptance-broken issue
        run: |
          set +e
          set -uo pipefail
          existing="$(gh issue list --repo "$REPO" --label "$LABEL" --state open \
            --limit 1 --json number --jq '.[0].number // empty' 2>/dev/null || true)"
          if [ -z "${existing:-}" ]; then
            echo "No open ${LABEL} issue. Nothing to close."
            exit 0
          fi
          gh issue comment "$existing" --repo "$REPO" \
            --body "The acceptance suite is GREEN again as of $(date -u '+%Y-%m-%d %H:%M UTC'): busbar \`${CANDIDATE}\` was built from source, booted, and the full Create→Read→Update→Delete→Import TestAcc suite passed against it. Closing. Run: ${RUN_URL}"
          gh issue close "$existing" --repo "$REPO" --reason completed
          echo "Closed #${existing}."
