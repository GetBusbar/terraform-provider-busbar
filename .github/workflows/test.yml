name: Test

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  # Build, vet, format check, and unit tests. No live gateway needed.
  build:
    name: build & unit test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - name: gofmt (must be clean)
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"; echo "$unformatted"; exit 1
          fi
      - name: docs are up to date
        run: |
          go run github.com/hashicorp/terraform-plugin-docs/cmd/tfplugindocs generate --provider-name busbar
          git diff --exit-code -- docs/ || {
            echo "docs/ is stale — run 'make docs' and commit the result"; exit 1;
          }
      - run: python3 -B -m unittest discover -s scripts/acceptance -p 'test_*.py' -v
      - run: go test ./... -v

  # Coverage (non-required, informational). Runs UNIT tests only — TF_ACC is left
  # unset, so the SDK skips the TestAcc acceptance lifecycle. Uploads to Codecov
  # tokenless; never gates CI (fail_ci_if_error: false).
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: unit tests with coverage
        run: go test ./... -covermode=atomic -coverprofile=coverage.out
      - name: upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.out
          slug: GetBusbar/terraform-provider-busbar
          fail_ci_if_error: false

  # The development compatibility baseline is an explicit core commit, separate
  # from the last release actually verified by acceptance-poll (initially none).
  acceptance:
    name: acceptance (TF_ACC)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        terraform: ["1.9.*", "1.10.*"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ matrix.terraform }}
          terraform_wrapper: false
      - name: read development compatibility baseline
        id: baseline
        run: |
          ref="$(cat .github/ACCEPTANCE_BUSBAR_REF)"
          [[ "$ref" =~ ^[0-9a-f]{40}$ ]]
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - name: checkout pinned busbar source
        uses: actions/checkout@v7
        with:
          repository: GetBusbar/busbar
          ref: ${{ steps.baseline.outputs.ref }}
          path: busbar-src
      - uses: dtolnay/rust-toolchain@stable
      - name: build gateway and signed gate fixture
        run: bash scripts/acceptance/gateway.sh build busbar-src "$RUNNER_TEMP/busbar"
      - name: boot gateway and verify installed gate
        run: bash scripts/acceptance/gateway.sh boot busbar-src "$RUNNER_TEMP/busbar"
      - name: acceptance tests
        env:
          TF_ACC: "1"
          BUSBAR_ENDPOINT: http://localhost:8081
          BUSBAR_ADMIN_TOKEN: tfacc-admin-token
        run: bash scripts/acceptance/test.sh
      - name: stop acceptance gateway
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/busbar/pid" ]; then
            kill "$(cat "$RUNNER_TEMP/busbar/pid")" 2>/dev/null || true
          fi
      - name: upload acceptance diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: acceptance-${{ matrix.terraform }}
          path: |
            ${{ runner.temp }}/busbar/busbar.log
            ${{ runner.temp }}/acceptance.log
