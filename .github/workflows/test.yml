name: Test

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  # Build, vet, format check, and unit tests. No live gateway needed.
  build:
    name: build & unit test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - name: gofmt (must be clean)
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"; echo "$unformatted"; exit 1
          fi
      - name: docs are up to date
        run: |
          go run github.com/hashicorp/terraform-plugin-docs/cmd/tfplugindocs generate --provider-name busbar
          git diff --exit-code -- docs/ || {
            echo "docs/ is stale — run 'make docs' and commit the result"; exit 1;
          }
      - run: go test ./... -v

  # Acceptance tests: the real Create->Read->Update->Delete->Import lifecycle
  # against a live busbar gateway.
  #
  # TODO(busbar 1.5.0 image): no getbusbar/busbar Docker image with 1.5.0 config/API support is
  # published yet (Docker Hub tops out at 1.4.1 as of this writing). Until a 1.5.0 image exists,
  # this job builds the gateway from GetBusbar/busbar@main source instead of `docker run
  # getbusbar/busbar:<tag>`. Once getbusbar/busbar:1.5.0 is published, switch the "build busbar"
  # + "boot busbar gateway" steps below back to a pinned `docker run getbusbar/busbar:1.5.0`
  # (faster, and tests the actual release artifact rather than a from-source build of a moving
  # `main`).
  #
  # The provider resources (virtual_key, hook, config) target the busbar 1.5.0 admin API
  # contract: keys are pure-auth signed tokens bound to a `groups:` bucket (the 1.4.x per-key
  # cap fields are gone), hooks dispatch to a signed `kind: hook` plugin (the retired
  # socket/webhook transports are gone), and the boot/apply config below is 1.5.0 syntax.
  # The daily acceptance-poll workflow re-proves this suite against each new busbar release.
  acceptance:
    name: acceptance (TF_ACC)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        terraform: ["1.9.*", "1.10.*"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ matrix.terraform }}
          terraform_wrapper: false
      - name: checkout busbar source (no 1.5.0 image published yet)
        uses: actions/checkout@v4
        with:
          repository: GetBusbar/busbar
          path: busbar-src
      - uses: dtolnay/rust-toolchain@stable
      - name: build busbar
        working-directory: busbar-src
        run: cargo build --release -p busbar
      - name: boot busbar gateway
        run: |
          mkdir -p "$RUNNER_TEMP/busbar"
          # busbar 1.5.0 config syntax. groups.tfacc-group must exist: 1.5.0 keys
          # are pure auth bound to a `groups:` bucket, and the virtual-key
          # acceptance test mints a key bound to tfacc-group.
          cat > "$RUNNER_TEMP/busbar/config.yaml" <<'YAML'
          listen: "127.0.0.1:8080"
          admin_listen: "127.0.0.1:8081"
          auth:
            chain: [keys]
            admin_auth:
              - admin-tokens: { token: { env: "BUSBAR_ADMIN_TOKEN" } }
          providers:
            anthropic:
              api_key: { env: "ANTHROPIC_API_KEY" }
          models:
            test-model:
              provider: anthropic
          groups:
            tfacc-group: {}
          YAML
          ANTHROPIC_API_KEY="dummy" BUSBAR_ADMIN_TOKEN="tfacc-admin-token" \
            BUSBAR_CONFIG="$RUNNER_TEMP/busbar/config.yaml" \
            BUSBAR_PROVIDERS="$GITHUB_WORKSPACE/busbar-src/providers.yaml" \
            ./busbar-src/target/release/busbar > "$RUNNER_TEMP/busbar/busbar.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/busbar/pid"
      - name: wait for gateway
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8081/api/v1/admin/info \
              -H "x-admin-token: tfacc-admin-token" >/dev/null; then
              echo "gateway up"; exit 0
            fi
            sleep 2
          done
          echo "gateway did not become ready"; cat "$RUNNER_TEMP/busbar/busbar.log"; exit 1
      - name: acceptance tests
        env:
          TF_ACC: "1"
          BUSBAR_ENDPOINT: http://localhost:8081
          BUSBAR_ADMIN_TOKEN: tfacc-admin-token
        run: go test ./internal/provider/ -run TestAcc -v -timeout 30m
