name: Release

# Publishes to the Terraform Registry: tag a semver release (v1.2.3) and
# GoReleaser builds the multi-arch archives, the SHA256SUMS, the GPG-signed
# signature, and packages the registry manifest. The registry consumes the
# resulting GitHub release.
#
# Required repository secret:
#   GPG_PRIVATE_KEY - ASCII-armored private signing key
#   PASSPHRASE      - passphrase for that key (optional; omit if the key has none)
# Required repository variable / secret used at sign time:
#   GPG_FINGERPRINT - the signing key's fingerprint (exported to the env below)
#
# The job is gated on GPG_PRIVATE_KEY being present, so a fork without the secret
# does not fail the release run.

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  goreleaser:
    permissions:
      contents: write # needed to create the GitHub release
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GoReleaser's signs.args reads GPG_FINGERPRINT to select the key.
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
